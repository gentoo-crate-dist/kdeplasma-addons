
name: Create crate dist
on:
  push:
    tags:
      - '**'

jobs:
  crate-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create crate dist
        uses: projg2/crate-dist-action@v1
        with:
          directories: kdeds/kameleon/qmk/kameleon-qmk-helper
          dist-filename: kdeplasma-addons-6.7.1-crates.tar.xz
          run-cargo-update: false

